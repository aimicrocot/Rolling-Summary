<div id="rolling_summary_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Rolling Summary</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="rs-row">
                <label class="checkbox_label" for="rs_auto_scan">
                    <input id="rs_auto_scan" type="checkbox" />
                    <span>Auto-summarize</span>
                </label>
                <label class="checkbox_label" for="rs_auto_hide">
                    <input id="rs_auto_hide" type="checkbox" />
                    <span>Auto-hide summarized messages</span>
                </label>
            </div>

            <div class="rs-row" id="rs_scan_interval_row" style="display:none;">
                <label for="rs_scan_interval">Auto-scan every N messages</label>
                <input id="rs_scan_interval" class="text_pole rs-number" type="number" min="1" step="1" />
            </div>

            <div class="rs-row">
                <label for="rs_skip_count">Keep last N messages visible</label>
                <input id="rs_skip_count" class="text_pole rs-number" type="number" min="2" step="1" />
            </div>

            <div class="rs-row">
                <label for="rs_summary_token_limit">Summary token limit</label>
                <input id="rs_summary_token_limit" class="text_pole rs-number" type="number" min="50" step="10" />
            </div>

            <div class="rs-row">
                <label for="rs_chars_per_token">Characters per token</label>
                <input id="rs_chars_per_token" class="text_pole rs-number" type="number" min="1" step="0.1" />
            </div>

            <div class="rs-buttons-row">
                <input id="rs_manual_scan" class="menu_button" type="button" value="Scan now" />
                <input id="rs_toggle_hide" class="menu_button" type="button" value="Hide" />
                <input id="rs_clear_summary" class="menu_button" type="button" value="Clear" />
            </div>

            <hr class="rs-divider" />

            <label class="checkbox_label" for="rs_use_custom_provider">
                <input id="rs_use_custom_provider" type="checkbox" />
                <span>Custom provider</span>
            </label>

            <div id="rs_custom_provider_panel" style="display:none;">
                <div class="rs-row">
                    <label for="rs_custom_api_url">API URL (OpenAI-compatible)</label>
                    <input id="rs_custom_api_url" class="text_pole" type="text" placeholder="https://api.example.com/v1" />
                </div>
                <div class="rs-row">
                    <label for="rs_custom_api_key">API Key</label>
                    <input id="rs_custom_api_key" class="text_pole" type="password" placeholder="sk-..." />
                </div>
                <div class="rs-row">
                    <label for="rs_custom_api_model">Model</label>
                    <input id="rs_custom_api_model" class="text_pole" type="text" placeholder="gpt-4o-mini" />
                </div>
                <input id="rs_test_custom_provider" class="menu_button" type="button" value="Test Connection" />
            </div>

            <hr class="rs-divider" />

            <div class="rs-summary-header">
                <b>Summary</b>
                <span id="rs_summary_meta" class="rs-summary-meta"></span>
            </div>
            <div id="rs_summary_combined" class="rs-summary-box">
                <small class="rs-placeholder">Empty...</small>
            </div>

        </div>
    </div>
</div>
